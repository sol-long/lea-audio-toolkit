name: build-and-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（留空则只构建不发布）'
        required: false

permissions:
  contents: write

jobs:
  build:
    # 构建脚本依赖 Windows 版 build-tools（aapt2.exe / d8.bat / apksigner.bat）
    runs-on: windows-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 下载极简 Android SDK（build-tools 35 + android-35）
        working-directory: module
        run: python -X utf8 tools/get_sdk.py

      - name: 单元测试（解析 / 判据，230+ 用例）
        working-directory: app
        run: python -X utf8 tools/selftest.py

      - name: 构建模块
        working-directory: module
        run: python -X utf8 tools/build.py

      - name: 构建 App
        working-directory: app
        run: python -X utf8 tools/build.py

      - name: 查看产物
        run: |
          Get-ChildItem module\dist, app\dist | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            module/dist/*.apk
            app/dist/*.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module/dist/LEAEnabler.apk
            app/dist/LEAToolbox.apk
          generate_release_notes: true
          body: |
            ## 安装

            | 文件 | 说明 |
            | --- | --- |
            | `LEAEnabler.apk` | Xposed 模块，装好后在 LSPosed / Vector 里启用，作用域选「蓝牙」 |
            | `LEAToolbox.apk` | 调试 App，打开后进「向导」Tab 跟 7 步走 |

            详细步骤见 [README](README.md) 与 [docs/USAGE.md](docs/USAGE.md)。
